difficulty_explanation = "The task requires implementing a stateful refresh token system with token-family tracking, rotation, replay-attack detection with cascade invalidation, and a session-listing endpoint. Each component interacts with the others: rotation must track superseded tokens to detect replays; replay detection must cascade-invalidate all tokens in the session family; the sessions endpoint must reflect login/logout/compromise events. Getting the data structures right across five modified or newly created files, while keeping TypeScript types consistent, is non-trivial."

solution_explanation = "Five changes are needed: (1) create src/services/tokenStore.ts implementing a token-family store with issueRefreshToken (creates family + session), rotateRefreshToken (supersedes old token, detects replays by checking isSuperseded flag, cascade-compromises family on replay), consumeRefreshToken (logout path), and getUserSessions; (2) extend src/services/jwt.ts with signRefreshToken and verifyRefreshToken using a separate secret; (3) update src/routes/auth.ts login to call issueRefreshToken and return both tokens, add /refresh that calls rotateRefreshToken and returns 401 on both 'replay' and 'invalid' results, add /logout that calls consumeRefreshToken; (4) create src/routes/sessions.ts with GET / that calls getUserSessions(req.user.userId); (5) register the sessions router at /api/sessions in src/index.ts."

verification_explanation = "14 tests verify: TypeScript compiles, dist/index.js produced, /health 200, login returns valid JWT, /api/profile 401 without token and 200 with valid token, login returns valid refreshToken, /auth/refresh returns both new token and new refreshToken (different from old), /auth/refresh rejects garbage token with 401, logout invalidates refresh token, superseded refresh token is rejected while the new one still works, replay of a superseded token also invalidates the newer token (cascade), /api/sessions requires Bearer auth, and /api/sessions returns active sessions after login and fewer sessions after logout."

