services:
  postgres:
    image: postgres:17-alpine
    container_name: nexahire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexahire
      POSTGRES_PASSWORD: nexahire
      POSTGRES_DB: nexahire
    ports:
      - "5432:5432"
    volumes:
      - nexahire-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexahire -d nexahire"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexahire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexahire-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexahire-pgdata:
  nexahire-redisdata:
